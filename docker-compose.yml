services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tes_backend}
      POSTGRES_USER: ${DB_USER:-muhfaiizr}
      POSTGRES_PASSWORD: ${DB_PASS:-admin}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-muhfaiizr} -d ${DB_NAME:-tes_backend}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-muhfaiizr}
      DB_PASS: ${DB_PASS:-admin}
      DB_NAME: ${DB_NAME:-tes_backend}
      JWT_SECRET: ${JWT_SECRET:-super-secret-inventory-jwt-key-2026}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
